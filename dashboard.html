<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mikan Dashboard</title>
  <link rel="stylesheet" href="board-style.css">
  
  <!-- Heatmap -->
  <script src="lib/d3.v7.min.js"></script>
  <link rel="stylesheet" href="lib/cal-heatmap.css">
  <script src="lib/cal-heatmap.min.js"></script>
  <script src="lib/popper.min.js"></script>
  <script src="lib/Tooltip.min.js"></script>
	
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="dark-mode-toggle" id="dark-mode-btn" title="Toggle dark mode">🌙</button>
      <h1>🍊 Mikan <span class="kanji">見間</span></h1>
      <p>Japanese Immersion Time Tracker</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="today-stat">0:00</div>
        <div class="stat-label">Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="week-stat">0:00</div>
        <div class="stat-label">This Week</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="month-stat">0:00</div>
        <div class="stat-label">This Month</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="total-stat">0:00</div>
        <div class="stat-label">All Time</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="daily-avg-stat">0:00</div>
        <div class="stat-label">Daily Average</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="monthly-avg-stat">0:00</div>
        <div class="stat-label">Monthly Average</div>
      </div>
    </div>
    
    <div class="heatmap-section">
      <div class="heatmap-title">
        <h3>🔥 Activity Heatmap</h3>
      </div>
      <div id="cal-heatmap"></div>
      <div class="heatmap-legend">
        <span>Less</span>
        <div class="heatmap-legend-colors">
          <div class="heatmap-legend-color" style="background: #fef3e2;"></div>
          <div class="heatmap-legend-color" style="background: #fed7aa;"></div>
          <div class="heatmap-legend-color" style="background: #fdba74;"></div>
          <div class="heatmap-legend-color" style="background: #fb923c;"></div>
          <div class="heatmap-legend-color" style="background: #f97316;"></div>
          <div class="heatmap-legend-color" style="background: #c2410c;"></div>
        </div>
        <span>More</span>
      </div>
    </div>
    
    <div class="charts-grid">
      <div class="chart-container">
        <div class="chart-title">📊 Last 7 Days</div>
        <div class="bar-chart" id="weekly-chart"></div>
      </div>
      <div class="chart-container">
        <div class="chart-title">📈 Monthly Overview</div>
        <div class="monthly-chart" id="monthly-chart"></div>
      </div>
    </div>

			<br>

	<div class="header">
		<button class="export-button" id="export-btn">Export to CSV</button>
	</div>
    
    <div class="footer">
      <div class="footer-links">
        <span>Created by <a href="https://www.youtube.com/JouzuJuls" target="_blank" rel="noopener">Jouzu Juls</a></span>
        <span class="footer-separator">•</span>
        <a href="https://discord.gg/HfyyB4uRHU" target="_blank" rel="noopener">Contact</a>
        <span class="footer-separator">•</span>
        <a href="https://ko-fi.com/jouzujuls" target="_blank" rel="noopener">☕ Support on Ko-fi</a>
        <span class="footer-separator">•</span>
        <span>© 2026</span>
      </div>
    </div>
  </div>
  
  <div class="tooltip" id="tooltip">
    <div class="tooltip-date"></div>
    <div class="tooltip-value"></div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
